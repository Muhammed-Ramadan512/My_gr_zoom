group 'com.groupcom.gr_zoom'
version '1.4.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // Removed: jcenter() — deprecated
        // Removed: flatDir (mobilertc.aar) — migrated to Maven Central
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.webcare.zoom.sdksample'
    buildFeatures {
        buildConfig true
    }
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        consumerProguardFiles 'proguard.txt'
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "androidx.security:security-crypto:1.1.0-alpha05"
    implementation "com.google.crypto.tink:tink-android:1.7.0"
    implementation "com.google.android.exoplayer:exoplayer-core:2.17.1"
    implementation "com.google.android.exoplayer:exoplayer-ui:2.17.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.material:material:1.11.0"
    implementation "com.google.android.flexbox:flexbox:3.0.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation "org.greenrobot:eventbus:3.3.1"

    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.airbnb.android:lottie:6.4.0"

    implementation "androidx.window:window:1.2.0"
    implementation "androidx.window:window-java:1.2.0"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation "com.davemorrissey.labs:subsampling-scale-image-view:3.10.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.databinding:viewbinding:8.3.0"

    // ── Zoom Meeting SDK 7.0.2 (16KB page-size aligned, latest stable) ───────
    // Replaces: api(name: 'mobilertc', ext: 'aar') ← 5.17.11 / 4KB-aligned
    // Available on Maven Central (versions start at 6.4.0.23300, 6.3.0 never existed)
    // 16KB compliance: version 6.6.0+ required — 7.0.2 is latest stable
    implementation 'us.zoom.meetingsdk:zoomsdk:7.0.2'
}
