group 'com.groupcom.gr_zoom'
version '1.4.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.webcare.zoom.sdksample'
    buildFeatures {
        buildConfig true
    }
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        consumerProguardFiles 'proguard.txt'
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "androidx.security:security-crypto:1.1.0-alpha05"
    implementation "com.google.crypto.tink:tink-android:1.7.0"
    implementation "com.google.android.exoplayer:exoplayer-core:2.17.1"
    implementation "com.google.android.exoplayer:exoplayer-ui:2.17.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.material:material:1.11.0"
    implementation "com.google.android.flexbox:flexbox:3.0.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation "org.greenrobot:eventbus:3.3.1"

    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.airbnb.android:lottie:6.4.0"

    implementation "androidx.window:window:1.2.0"
    implementation "androidx.window:window-java:1.2.0"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation "com.davemorrissey.labs:subsampling-scale-image-view:3.10.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.databinding:viewbinding:8.3.0"

    // ── Zoom Meeting SDK 7.0.2 (16KB page-size aligned) ───────────────────────
    // Must be `api` so Zoom's transitive Compose deps are visible to the consuming app.
    api 'us.zoom.meetingsdk:zoomsdk:7.0.2'

    // ── Compose 1.8.1 — minimum required by Zoom SDK 7.0.2 ───────────────────
    // Zoom SDK 7.0.2 requires:
    //   foundation >= 1.7.0 → toggleable-oSLSa3U (nullable MutableInteractionSource)
    //   foundation >= 1.8.0 → BasicText-RWo7tUw  (TextAutoSize param added in 1.8)
    //
    // Using `api` exposes these as transitive deps to the consuming Flutter app.
    // Gradle's default conflict resolution (highest version wins) ensures the app
    // uses >= 1.8.1 even if another plugin requests an older foundation version.
    //
    // NOTE: runtime is NOT included here — runtime-annotation became a separate
    // artifact in Compose 1.8+. Declaring runtime:1.7.x alongside
    // runtime-annotation:1.9.x causes Duplicate class errors for
    // Immutable / Stable / StableMarker.
    api "androidx.compose.foundation:foundation:1.8.1"
    api "androidx.compose.foundation:foundation-layout:1.8.1"
    api "androidx.compose.ui:ui:1.8.1"
    api "androidx.compose.material3:material3:1.3.1"
}
